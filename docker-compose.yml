# Sobe o Jenkins com:  docker compose up -d --build
# Depois acesse http://localhost:8081 (admin / admin)

services:
  jenkins:
    build: ./jenkins
    container_name: jenkins-aula
    restart: unless-stopped

    environment:
      # A 8080 é a porta do sistema, inclusive dentro do container durante
      # o build. Com o Jenkins na 8081, os dois não brigam.
      - JENKINS_OPTS=--httpPort=8081

      # Pula o assistente de configuração inicial.
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false

    ports:
      - "8081:8081"
      - "50000:50000"

    volumes:
      # Mantém jobs, plugins e configurações mesmo se o container morrer
      - jenkins_home:/var/jenkins_home

      # Plano B offline: deixa a pasta do projeto visível em /projeto, para
      # o Jenkins clonar dali em vez de buscar no GitHub.
      - ./:/projeto:ro

volumes:
  jenkins_home:
