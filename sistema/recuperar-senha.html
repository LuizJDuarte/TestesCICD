<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar senha - MiniLoja</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="tela-centralizada">

  <div class="cartao">

    <h1 id="titulo-recuperar">Recuperar senha</h1>
    <p class="subtitulo">Informe seu e-mail e enviaremos um link de redefinição.</p>

    <label for="email-recuperacao">E-mail</label>
    <input type="email" id="email-recuperacao" placeholder="seu@email.com">

    <button id="btn-enviar">Enviar link</button>

    <div id="mensagem-sucesso"></div>

    <p class="dica">
      <a id="link-voltar" href="index.html">Voltar para o login</a>
    </p>

  </div>

  <script src="js/recuperar-senha.js"></script>
</body>
</html>
